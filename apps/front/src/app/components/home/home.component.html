<main style="padding: 1em">
  <h1>Galeria de sites favoritos</h1>

  <p>Esta é minha galeria de sites</p>

  <mat-grid-list
    [cols]="(umaColuna$ | async) ? 1 : (duasColunas$ | async) ? 2 : 3"
    gutterSize="1em"
  >
    @for (favorito of favoritos$ | async; track $index) {
    <mat-grid-tile
      [style.background-color]="'lightgray'"
      [style.border]="'.5em'"
    >
      <mat-card class="favorito-card">
          <div style="text-align: center;">
            <img
              mat-card-image
              src="{{favorito.imagem}}"
              alt="Photo of a Shiba Inu"
              style="width: 100%;"
            >
          </div>
          <mat-card-content>
            <mat-card-title>
              {{ favorito.titulo }}
            </mat-card-title>
            <p>
              {{ favorito.descricao }}
            </p>
          </mat-card-content>
          <mat-card-actions>
            <a mat-button [href]="favorito.url">Visitar</a>
            <button 
              mat-button
              routerLink="/favorito-edicao/{{favorito.id}}"
            >
            Editar
            </button>
          </mat-card-actions>
        </mat-card>


    </mat-grid-tile>
    }
  </mat-grid-list>
</main>
